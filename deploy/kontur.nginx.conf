# Контур Дома — сайт + api.php на одной машине.
# Кладётся в /etc/nginx/sites-available/kontur, PHPVER подставляет setup-ubuntu.sh.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    root /var/www/kontur;
    index index.html;

    # документы к заявкам — до 20 МБ на файл
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # сервер кабинета: регистрация, вход, заявки, документы
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/phpPHPVER-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 60s;
    }

    # база и загруженные документы напрямую не отдаются — только через api.php
    location ^~ /uploads/        { deny all; return 404; }
    location ~* ^/kontur\.sqlite { deny all; return 404; }
    location ~* \.php$           { return 404; }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 7d;
        access_log off;
    }

    # адреса вида #/catalog — обычный одностраничный сайт
    location / {
        try_files $uri $uri/ /index.html;
    }
}
